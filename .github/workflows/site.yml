name: Publish site pages
# Publishes only the static pages (terms, privacy, icon). No video.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [pages/**]
permissions:
  contents: read
concurrency: native-upload
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          sparse-checkout: pages
      - run: |
          mkdir site; cp pages/* site/; touch site/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
