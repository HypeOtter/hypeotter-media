name: Native video upload
on:
  schedule:
    - cron: "47 13-23,0-3 * * *"   # hourly; script enforces posting hours, gap and native.enabled
  workflow_dispatch:
    inputs:
      slug:
        description: "approved/<slug> to post (blank = next in line)"
        type: string
        default: ""
      only:
        description: "Comma list of platforms (blank = config): twitter,facebook,threads,instagram,tiktok"
        type: string
        default: ""
      dry_run:
        description: "Host the file and print captions, post nothing"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: native-upload
  cancel-in-progress: false
jobs:
  pick:
    if: github.repository == 'HypeOtter/hypeotter-media'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      slug: ${{ steps.pick.outputs.slug }}
      token: ${{ steps.pick.outputs.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          repository: HypeOtter/HypeOtter
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}
          path: data
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /yt_uploaded.json
            /sent.json
            /review.json
            /social/
            /approved/*/manifest.json
      - id: pick
        env:
          DATA_DIR: ${{ github.workspace }}/data
          SLUG: ${{ inputs.slug }}
          ONLY: ${{ inputs.only }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          BUFFER_TOKEN_2: ${{ secrets.BUFFER_TOKEN_2 }}
        run: python3 bots/native_upload.py pick
      - name: Fetch the video and build the media site
        if: steps.pick.outputs.slug != ''
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
          SLUG: ${{ steps.pick.outputs.slug }}
          TOKEN: ${{ steps.pick.outputs.token }}
        run: |
          mkdir -p site/v/$TOKEN
          curl -sfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/HypeOtter/HypeOtter/contents/approved/$SLUG/final.mp4" -o "site/v/$TOKEN/$SLUG.mp4"
          test -s "site/v/$TOKEN/$SLUG.mp4"
          touch site/.nojekyll
          cp pages/* site/
      - if: steps.pick.outputs.slug != ''
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site
      - if: steps.pick.outputs.slug != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: plan
          path: |
            plan.json
            site/v
          retention-days: 1

  host:
    needs: pick
    if: needs.pick.outputs.slug != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  post:
    needs: [pick, host]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          repository: HypeOtter/HypeOtter
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}
          path: data
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /yt_uploaded.json
            /sent.json
            /social/
            /approved/*/manifest.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: plan
      - name: Check the public link
        env:
          BASE: ${{ needs.host.outputs.page_url }}
          SLUG: ${{ needs.pick.outputs.slug }}
          TOKEN: ${{ needs.pick.outputs.token }}
        run: |
          URL="${BASE%/}/v/$TOKEN/$SLUG.mp4"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -I "$URL"); [ "$code" = 200 ] && break; sleep 20
          done
          [ "$code" = 200 ] || { echo "media link not live ($code)"; exit 1; }
          echo "MEDIA_URL=$URL" >> "$GITHUB_ENV"
          echo "VIDEO_FILE=$PWD/site/v/$TOKEN/$SLUG.mp4" >> "$GITHUB_ENV"
      - name: Post natively
        env:
          DATA_DIR: ${{ github.workspace }}/data
          ONLY: ${{ inputs.only }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          BUFFER_TOKEN_2: ${{ secrets.BUFFER_TOKEN_2 }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          [ -f "$VIDEO_FILE" ] || { echo "video file missing"; exit 1; }
          python3 bots/native_upload.py post
      - name: Save state to private repo
        if: always()
        working-directory: data
        run: |
          git config user.name "HypeOtter bot"; git config user.email "357183714+HypeOtter@users.noreply.github.com"
          git add social/native.json social/shared.json $(ls social/tiktok_auth.json 2>/dev/null) || exit 0
          git commit -q -m "[social] native state" || exit 0
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && exit 0; sleep $((i*10)); done; exit 1

  unhost:
    needs: [pick, post]
    if: always() && needs.pick.outputs.slug != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          sparse-checkout: pages
      - run: |
          mkdir site; cp pages/* site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site
          name: github-pages-empty
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
        with:
          artifact_name: github-pages-empty
