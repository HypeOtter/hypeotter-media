<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HypeOtter Uploader</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:2rem auto;padding:0 1rem;line-height:1.5}#c{display:none;word-break:break-all;font:16px monospace;background:#f3f3f3;padding:1rem;border-radius:8px}button{font-size:18px;padding:.6rem 1.2rem;margin-top:.8rem}</style>
<p>HypeOtter Uploader, a private tool for the HypeOtter channel. <a href="terms.html">Terms</a> · <a href="privacy.html">Privacy</a></p>
<div id="c"></div><button id="b" style="display:none">Copy code</button>
<script>
var q=new URLSearchParams(location.search),k=q.get("code");
if(k){var c=document.getElementById("c"),b=document.getElementById("b");c.textContent=k;c.style.display="block";b.style.display="inline-block";
b.onclick=function(){navigator.clipboard.writeText(k).then(function(){b.textContent="Copied. Paste it to Hark."})};
history.replaceState(null,"",location.pathname);}
</script>
